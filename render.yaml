services:
  - type: web
    name: clinic-whatsapp-bot
    runtime: python
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "python server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
